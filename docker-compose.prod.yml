# =============================================================================
# EMBLEMA NEXUS — Infraestructura de Producción Docker Compose
# =============================================================================
# Stack multi-contenedor:
# 1. app: Next.js 16 (Standalone)
# 2. postgres: PostgreSQL 15 Alpine (Base de datos relacional y Nextcloud)
# 3. redis: Redis Alpine (Caché y sesiones de Nextcloud)
# 4. nextcloud: Nextcloud Apache (Gestor documental WebDAV)
# 5. reverse-proxy: Caddy Alpine (Terminación SSL automática Let's Encrypt / HTTP/3)
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Aplicación Web Principal — Next.js Standalone
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emblema-app
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - emblema-network

  # ---------------------------------------------------------------------------
  # 2. Motor de Base de Datos — PostgreSQL 15 Alpine
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: emblema-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emblema_nexus}
      POSTGRES_USER: ${POSTGRES_USER:-emblema_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTCLOUD_DB: ${NEXTCLOUD_DB:-nextcloud}
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-postgres.sh:/docker-entrypoint-initdb.d/00-init-postgres.sh:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - emblema-network

  # ---------------------------------------------------------------------------
  # 3. Servicio de Caché en Memoria — Redis Alpine
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: emblema-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-emblema_redis_secret}", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-emblema_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - emblema-network

  # ---------------------------------------------------------------------------
  # 4. Servidor de Gestión Documental WebDAV — Nextcloud Apache
  # ---------------------------------------------------------------------------
  nextcloud:
    image: nextcloud:apache
    container_name: emblema-nextcloud
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-emblema_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:-emblema_redis_secret}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "${NEXTCLOUD_DOMAIN:-cloud.emblemanexus.com} ${APP_DOMAIN:-app.emblemanexus.com} nextcloud localhost 127.0.0.1"
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: "https://${NEXTCLOUD_DOMAIN:-cloud.emblemanexus.com}"
      APACHE_DISABLE_REWRITE_IP: 1
      TRUSTED_PROXIES: "172.16.0.0/12 10.0.0.0/8 192.168.0.0/16 127.0.0.1"
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 10G
    volumes:
      - nextcloud_data:/var/www/html
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - emblema-network

  # ---------------------------------------------------------------------------
  # 5. Proxy Inverso & Terminación SSL — Caddy Alpine
  # ---------------------------------------------------------------------------
  reverse-proxy:
    image: caddy:alpine
    container_name: emblema-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.emblemanexus.com}
      NEXTCLOUD_DOMAIN: ${NEXTCLOUD_DOMAIN:-cloud.emblemanexus.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@emblemanexus.com}
    depends_on:
      app:
        condition: service_healthy
      nextcloud:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - emblema-network

# -----------------------------------------------------------------------------
# Volúmenes Persistentes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: emblema_postgres_data
  nextcloud_data:
    name: emblema_nextcloud_data
  redis_data:
    name: emblema_redis_data
  caddy_data:
    name: emblema_caddy_data
  caddy_config:
    name: emblema_caddy_config
  caddy_logs:
    name: emblema_caddy_logs

# -----------------------------------------------------------------------------
# Red Aislada de Producción
# -----------------------------------------------------------------------------
networks:
  emblema-network:
    name: emblema-network
    driver: bridge
