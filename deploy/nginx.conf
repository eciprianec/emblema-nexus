# =============================================================================
# EMBLEMA NEXUS — Configuración de Producción para Nginx
# Alternativa empresarial al proxy inverso Caddy
# =============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Registro de auditoría con formato extendido
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    # Optimizaciones de rendimiento del kernel
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Ocultar versión de Nginx por seguridad
    server_tokens off;

    # Compresión Gzip para optimizar ancho de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Configuración de SSL/TLS moderno y seguro
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upstreams hacia los contenedores internos de Docker
    upstream app_backend {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream nextcloud_backend {
        server nextcloud:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Redirección global HTTP (Puerto 80) -> HTTPS (Puerto 443)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name app.emblemanexus.com cloud.emblemanexus.com;

        # Endpoint para renovación de certificados Let's Encrypt / Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # 1. Servidor Principal: Next.js Standalone (app.emblemanexus.com)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.emblemanexus.com;

        # Certificados SSL (montados desde volumen /etc/letsencrypt/)
        ssl_certificate /etc/letsencrypt/live/app.emblemanexus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.emblemanexus.com/privkey.pem;

        # Cabeceras de endurecimiento de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        client_max_body_size 64M;

        # Caché de activos estáticos de Next.js (inmutables)
        location /_next/static/ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Archivos estáticos en carpeta public
        location /public/ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Proxy inverso principal
        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;

            # Soporte completo para WebSockets y Server-Sent Events
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cabeceras de reenvío de cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_read_timeout 90s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 90s;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # -------------------------------------------------------------------------
    # 2. Servidor Documental WebDAV: Nextcloud (cloud.emblemanexus.com)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name cloud.emblemanexus.com;

        # Certificados SSL
        ssl_certificate /etc/letsencrypt/live/cloud.emblemanexus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cloud.emblemanexus.com/privkey.pem;

        # Cabeceras de seguridad específicas para Nextcloud
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Referrer-Policy "no-referrer" always;

        # Subidas de archivos pesados (hasta 10 GB para planos y expedientes escaneados)
        client_max_body_size 10G;
        client_body_timeout 600s;
        fastcgi_buffers 64 4K;

        # Redirecciones requeridas para sincronización CalDAV y CardDAV
        location = /.well-known/carddav {
            return 301 /remote.php/dav;
        }

        location = /.well-known/caldav {
            return 301 /remote.php/dav;
        }

        location = /.well-known/webfinger {
            return 301 /index.php/.well-known/webfinger;
        }

        location = /.well-known/nodeinfo {
            return 301 /index.php/.well-known/nodeinfo;
        }

        # Proxy inverso al contenedor de Nextcloud Apache
        location / {
            proxy_pass http://nextcloud_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Deshabilitar buffering para subidas y descargas WebDAV en streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_max_temp_file_size 0;
        }
    }
}
